[project]
name = "mflm"
version = "0.0.1"
description = "Mass-Field Language Model — field-based computation replacing attention."
authors = [{name = "Danil Vladov"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "tiktoken>=0.7.0", "tqdm>=4.66.0", "requests", "transformers>=4.40.0", "peft>=0.10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
